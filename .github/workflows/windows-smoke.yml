name: Eight Bells Windows CI
on:
  push:
  pull_request:
permissions:
  contents: read
defaults:
  run:
    # Every run step is Windows PowerShell 5.1 (org rule for Windows runners).
    shell: powershell
jobs:
  smoke:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Check PowerShell syntax
        shell: powershell
        run: |
          $files = @('Start-EightBells.ps1','Stop-EightBells.ps1','Stop-LogHawk.ps1','EightBells-Process.ps1','tests/Smoke-Test.ps1')
          foreach($path in $files) {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }
          }
      - name: Test parser and quality engine
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'   # stderr output is not a failure; the exit code decides
          node tests\engine.test.js
          if ($LASTEXITCODE -ne 0) { throw "exit code $LASTEXITCODE" }   # also catches a command that never ran
      - name: Test browser tab lifecycle (heartbeat and leaving beacon)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'   # stderr output is not a failure; the exit code decides
          node tests\lifecycle.test.js
          if ($LASTEXITCODE -ne 0) { throw "exit code $LASTEXITCODE" }   # also catches a command that never ran
      - name: Test watch-profile rules
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'   # stderr output is not a failure; the exit code decides
          node tests\profiles.test.js
          if ($LASTEXITCODE -ne 0) { throw "exit code $LASTEXITCODE" }   # also catches a command that never ran
      - name: End-to-end Windows service smoke
        shell: powershell
        run: .\tests\Smoke-Test.ps1
